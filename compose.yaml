services:
  beat-analyzer:
    build: .
    container_name: ${CONTAINER_NAME:-beat-analyzer}
    user: "${PUID:-1027}:${PGID:-100}"
    environment:
      - PUID=${PUID:-1027}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Riyadh}
      - UMASK=${UMASK:-022}
      - DATA_DIR=/data
      - IMPORT_DIR=/import
    volumes:
      - ${BEAT_ANALYZER_MUSIC_DIR:-/volume1/docker/containers/beat-analyzer/music}:/data/music
      - ${BEAT_ANALYZER_ANALYSIS_DIR:-/volume1/docker/containers/beat-analyzer/analysis}:/data/analysis
      - ${BEAT_ANALYZER_EXPORTS_DIR:-/volume1/docker/containers/beat-analyzer/exports}:/data/exports
      - ${BEAT_ANALYZER_IMPORT_DIR:-/volume1/data/media/beat-analyzer}:/import
    ports:
      - "${BEAT_ANALYZER_PORT:-8000}:8000/tcp"
    network_mode: ${BEAT_ANALYZER_NETWORK_MODE:-synobridge}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); raise SystemExit(0 if data == {'status': 'ok'} else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: always
